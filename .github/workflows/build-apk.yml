name: Build WAHJ Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload WAHJ APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wahj-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="wahj-v1.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk wahj-app.apk
          gh release create "$TAG" wahj-app.apk \
            --title "WAHJ v1.${{ github.run_number }}" \
            --notes "Direct downloadable APK for WAHJ Smart Family Control"
